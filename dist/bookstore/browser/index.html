<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookstore & Quotes</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- FIX: the old kit.fontawesome.com script used FA's documentation placeholder ID
       (a076d05399) which is not a real kit and will not load icons. Using the free
       CDN build instead — swap for your own kit URL if you have a Font Awesome account. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      --bg-color: #ffffff;
      --text-color: #000000;
      --header-bg: #e0e0e0;
      --sidebar-bg: #343a40;
      --footer-bg: #f8f9fa;
      --card-bg: #ffffff;
      --card-text: #212529;
      --card-muted: #6c757d;
    }

    body.dark-theme {
      --bg-color: #212529;
      --text-color: #f8f9fa;
      --header-bg: #343a40;
      --sidebar-bg: #16181b;
      --footer-bg: #343a40;
      /* FIX: cards/modals used to stay hardcoded white in dark mode.
         Now they follow the theme too. */
      --card-bg: #2b2f36;
      --card-text: #f1f3f5;
      --card-muted: #adb5bd;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color .2s, color .2s;
    }

    #sidebar {
      min-width: 250px;
      max-width: 250px;
      height: 100vh;
      background-color: var(--sidebar-bg);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1050;
      transition: transform 0.3s;
    }

    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      /* FIX: removed the stray extra 58px margin that used to double up with this
         wrapper's own 250px margin (the old `.page{margin-left:58px}` rule is gone). */
      margin-left: 250px;
    }

    #content-area {
      flex: 1;
      padding: 24px;
    }

    .header {
      background-color: var(--header-bg);
      padding: 20px;
      text-align: center;
    }

    .navbar, footer {
      background-color: var(--header-bg) !important;
    }

    .book-card, .card {
      background-color: var(--card-bg);
      color: var(--card-text);
    }

    .book-card .text-muted, .card .text-muted {
      color: var(--card-muted) !important;
    }

    .modal-content {
      background-color: var(--card-bg);
      color: var(--card-text);
    }

    @media (max-width: 991.98px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.show { transform: translateX(0); }
      .app-body { margin-left: 0; }
    }

    .page { display: none; }
    .page.active { display: block; }

    .quote-item blockquote { margin-bottom: 0; }
    .required-note { font-size: .8rem; color: var(--card-muted); }
  </style>
</head>

<body>
  <div style="display:flex; flex-direction:row; min-height:100vh;">
    <nav id="sidebar" class="d-flex flex-column p-3">
      <h4 class="text-white mb-4"><i class="fas fa-book"></i> BookQuotes</h4>
      <ul class="nav nav-pills flex-column mb-auto">
        <!-- FIX: "Home" is now the actual book list/CRUD page (matches the spec:
             "a page that displays a list of all books" + "a home page with a button
             to add a new book" are the same page). Removed the separate duplicate
             "Books" nav item that pointed at an identical-but-disconnected page. -->
        <li class="nav-item">
          <a href="#" class="nav-link active" data-page="home" onclick="showPage('home'); return false;">
            <i class="fas fa-home"></i> Home
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-page="quotes" onclick="showPage('quotes'); return false;">
            <i class="fas fa-quote-right"></i> My Quotes
          </a>
        </li>
      </ul>
    </nav>

    <div class="app-body">
      <nav class="navbar navbar-light bg-light px-3 d-flex align-items-center sticky-top py-2">
        <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle" type="button" aria-label="Toggle menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="ms-auto d-flex align-items-center gap-2">
          <button id="theme-toggle" class="btn btn-outline-secondary" aria-label="Switch theme">
            <i class="fas fa-moon" id="theme-icon"></i>
          </button>
          <button id="loginBtn" class="btn btn-outline-secondary">
            <i class="fas fa-user"></i> <span id="loginBtnText">Login</span>
          </button>
        </div>
      </nav>

      <div class="header">
        <h1><i class="fas fa-quote-left"></i> Welcome to Bookstore</h1>
      </div>

      <div id="content-area">

        <!-- HOME / BOOKS PAGE ================================================ -->
        <div id="home" class="page active">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div>
              <h2 class="mb-1">My Books</h2>
              <p class="mb-0 text-muted">Manage your book collection.</p>
            </div>
            <!-- FIX: Add New Book button now lives on Home, and it is disabled until
                 logged in (spec requires auth before CRUD). -->
            <button class="btn btn-success" id="addBookBtn" disabled>
              <i class="fas fa-plus"></i> Add New Book
            </button>
          </div>
          <p id="loginHint" class="required-note">Log in to add, edit, or delete books.</p>
          <div id="bookCardsContainer" class="d-flex flex-wrap gap-3"></div>
          <p id="noBooksMsg" class="text-muted" style="display:none;">No books yet — add your first one.</p>
        </div>

        <!-- ADD BOOK PAGE (was a modal; spec asks for a redirect to a form page) === -->
        <div id="addBook" class="page">
          <h2>Add New Book</h2>
          <form id="addBookForm" class="col-12 col-md-6">
            <div class="mb-3">
              <label for="bookTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="bookTitle" required>
            </div>
            <div class="mb-3">
              <label for="bookAuthor" class="form-label">Author</label>
              <input type="text" class="form-control" id="bookAuthor" required>
            </div>
            <div class="mb-3">
              <label for="pubDate" class="form-label">Publication Year</label>
              <input type="number" class="form-control" id="pubDate" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Book</button>
            <button type="button" class="btn btn-outline-secondary" onclick="showPage('home')">Cancel</button>
          </form>
        </div>

        <!-- EDIT BOOK PAGE (was a modal, same fix as above) ==================== -->
        <div id="editBook" class="page">
          <h2>Edit Book</h2>
          <form id="editBookForm" class="col-12 col-md-6">
            <input type="hidden" id="editBookId">
            <div class="mb-3">
              <label for="editBookTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editBookTitle" required>
            </div>
            <div class="mb-3">
              <label for="editBookAuthor" class="form-label">Author</label>
              <input type="text" class="form-control" id="editBookAuthor" required>
            </div>
            <div class="mb-3">
              <label for="editPubDate" class="form-label">Publication Year</label>
              <input type="number" class="form-control" id="editPubDate" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-outline-secondary" onclick="showPage('home')">Cancel</button>
          </form>
        </div>

        <!-- QUOTES PAGE ======================================================== -->
        <div id="quotes" class="page">
          <h2>My Quotes</h2>
          <div class="row">
            <div class="col-12 col-md-7">
              <ul class="list-group" id="quotesList"></ul>
            </div>
            <div class="col-12 col-md-5">
              <form id="quoteForm" class="mb-4">
                <input type="hidden" id="quoteEditId">
                <div class="mb-3">
                  <label for="quoteText" class="form-label">Quote</label>
                  <textarea class="form-control" id="quoteText" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                  <label for="quoteAuthor" class="form-label">Author</label>
                  <input type="text" class="form-control" id="quoteAuthor" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="quoteSubmitBtn">
                  <i class="fas fa-plus"></i> Add Quote
                </button>
                <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="quoteCancelBtn">
                  Cancel edit
                </button>
              </form>
            </div>
          </div>
        </div>

      </div>

      <footer class="p-3 text-center">
        <p class="mb-0">© 2026 Bookstore &amp; Quotes. All rights reserved.</p>
      </footer>
    </div>
  </div>

  <!-- LOGIN / REGISTER MODAL =============================================== -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Log in or register</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>
          <form id="authForm">
            <div class="mb-3">
              <label for="authUsername" class="form-label">Username</label>
              <input type="text" class="form-control" id="authUsername" required>
            </div>
            <div class="mb-3">
              <label for="authPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="authPassword" minlength="8" required>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill" data-mode="login">Login</button>
              <button type="button" class="btn btn-outline-primary flex-fill" id="registerBtn">Register</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ======================================================================
       ASSUMPTIONS ON THE BACKEND API
       I only had your real login URL to go on:
         POST https://books123-b2fqgpcgcsghb2f8.indiasouthcentral-01.azurewebsites.net/api/auth/login
       I've assumed a matching REST shape for the rest of a standard .NET 9
       minimal-API/JWT setup. Replace API_BASE and the paths below with your
       actual routes if they differ.
       ====================================================================== */
    const API_BASE = "https://books123-b2fqgpcgcsghb2f8.indiasouthcentral-01.azurewebsites.net/api";
    const ENDPOINTS = {
      login: `${API_BASE}/auth/login`,
      register: `${API_BASE}/auth/register`,
      books: `${API_BASE}/books`
    };

    // ---- Auth state ---------------------------------------------------
    function getToken() { return localStorage.getItem('token'); }
    function getUsername() { return localStorage.getItem('username'); }
    function isLoggedIn() { return !!getToken(); }

    function authHeaders(extra = {}) {
      const h = { 'Content-Type': 'application/json', ...extra };
      const token = getToken();
      // FIX: this is the piece that was completely missing — the JWT is now
      // actually attached to every book request instead of just sitting in
      // localStorage unused.
      if (token) h['Authorization'] = `Bearer ${token}`;
      return h;
    }

    function setLoggedInUI() {
      const loggedIn = isLoggedIn();
      document.getElementById('addBookBtn').disabled = !loggedIn;
      document.getElementById('loginHint').style.display = loggedIn ? 'none' : 'block';
      document.getElementById('loginBtnText').textContent = loggedIn ? `Logout (${getUsername()})` : 'Login';
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      if (isLoggedIn()) {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        setLoggedInUI();
        loadBooks();
      } else {
        document.getElementById('authForm').reset();
        document.getElementById('authAlert').classList.add('d-none');
        new bootstrap.Modal(document.getElementById('authModal')).show();
      }
    });

    function showAuthError(msg) {
      const el = document.getElementById('authAlert');
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    // FIX: Register now actually calls the backend instead of only writing
    // to localStorage, so a "registered" user really exists server-side.
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!username || !password) { showAuthError('Enter a username and password.'); return; }

      try {
        const res = await fetch(ENDPOINTS.register, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) throw new Error(`Registration failed (${res.status})`);
        showAuthError('');
        document.getElementById('authAlert').classList.add('d-none');
        alert('Registered! You can log in now.');
      } catch (err) {
        showAuthError(err.message || 'Registration failed.');
      }
    });

    // FIX: Login now trusts the API as the source of truth (no more checking
    // a locally-cached user list before ever calling the server).
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!username || !password) { showAuthError('Enter a username and password.'); return; }

      try {
        const res = await fetch(ENDPOINTS.login, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) throw new Error('Invalid username or password.');
        const data = await res.json();
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', username);
        bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
        setLoggedInUI();
        loadBooks();
      } catch (err) {
        showAuthError(err.message || 'Login failed.');
      }
    });

    // ---- Page routing (redirect-style navigation, no modals for CRUD) ---
    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(page).classList.add('active');
      document.querySelectorAll('.nav-link[data-page]').forEach(link => {
        link.classList.toggle('active', link.dataset.page === page);
      });
    }

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('sidebarToggle');
      if (!sidebar.classList.contains('show')) return;
      if (sidebar.contains(e.target) || toggleBtn.contains(e.target)) return;
      sidebar.classList.remove('show');
    });

    // ---- Theme toggle ---------------------------------------------------
    const themeIcon = document.getElementById('theme-icon');
    document.getElementById('theme-toggle').addEventListener('click', () => {
      document.body.classList.toggle('dark-theme');
      const dark = document.body.classList.contains('dark-theme');
      themeIcon.classList.toggle('fa-moon', !dark);
      themeIcon.classList.toggle('fa-sun', dark);
    });

    // ---- Books: local cache as a resilient fallback, API as source of truth
    // (If your API is unreachable while you develop, this keeps the UI usable;
    // once the real endpoints are live, drop the catch-block fallback.)
    function localBooks() { return JSON.parse(localStorage.getItem('books_cache')) || []; }
    function saveLocalBooks(books) { localStorage.setItem('books_cache', JSON.stringify(books)); }

    async function loadBooks() {
      const container = document.getElementById('bookCardsContainer');
      const noBooksMsg = document.getElementById('noBooksMsg');
      container.innerHTML = '';

      if (!isLoggedIn()) {
        noBooksMsg.style.display = 'none';
        return;
      }

      let books = [];
      try {
        const res = await fetch(ENDPOINTS.books, { headers: authHeaders() });
        if (!res.ok) throw new Error('API not reachable');
        books = await res.json();
        saveLocalBooks(books);
      } catch {
        books = localBooks(); // fallback for offline/demo use
      }

      noBooksMsg.style.display = books.length ? 'none' : 'block';
      books.forEach(book => container.appendChild(renderBookCard(book)));
    }

    function renderBookCard(book) {
      const card = document.createElement('div');
      card.className = 'card book-card';
      card.style.width = '14rem';
      card.innerHTML = `
        <div class="card-body">
          <h5 class="card-title">${escapeHtml(book.title)}</h5>
          <h6 class="card-subtitle mb-2 text-muted">${escapeHtml(book.author)}</h6>
          <p class="card-text">Published in ${escapeHtml(String(book.year))}</p>
          <button class="btn btn-primary btn-sm me-1 edit-btn">Edit</button>
          <button class="btn btn-danger btn-sm delete-btn">Delete</button>
        </div>`;
      card.querySelector('.edit-btn').addEventListener('click', () => openEditBook(book));
      card.querySelector('.delete-btn').addEventListener('click', () => deleteBook(book));
      return card;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('addBookBtn').addEventListener('click', () => {
      document.getElementById('addBookForm').reset();
      showPage('addBook'); // FIX: real page redirect instead of a modal
    });

    // FIX: submit now calls the API (with the JWT attached) and, on success,
    // redirects back to Home per the spec — "After submitting the form, the
    // user should be redirected back to the home page."
    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const book = {
        title: document.getElementById('bookTitle').value.trim(),
        author: document.getElementById('bookAuthor').value.trim(),
        year: parseInt(document.getElementById('pubDate').value, 10)
      };
      try {
        const res = await fetch(ENDPOINTS.books, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(book)
        });
        if (!res.ok) throw new Error();
      } catch {
        // fallback so the demo still works without a live backend
        const books = localBooks();
        book.id = crypto.randomUUID();
        books.push(book);
        saveLocalBooks(books);
      }
      await loadBooks();
      showPage('home');
    });

    function openEditBook(book) {
      document.getElementById('editBookId').value = book.id ?? '';
      document.getElementById('editBookTitle').value = book.title;
      document.getElementById('editBookAuthor').value = book.author;
      document.getElementById('editPubDate').value = book.year;
      showPage('editBook'); // FIX: real page redirect instead of a modal
    }

    document.getElementById('editBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editBookId').value;
      const updated = {
        id,
        title: document.getElementById('editBookTitle').value.trim(),
        author: document.getElementById('editBookAuthor').value.trim(),
        year: parseInt(document.getElementById('editPubDate').value, 10)
      };
      try {
        const res = await fetch(`${ENDPOINTS.books}/${id}`, {
          method: 'PUT',
          headers: authHeaders(),
          body: JSON.stringify(updated)
        });
        if (!res.ok) throw new Error();
      } catch {
        const books = localBooks();
        const idx = books.findIndex(b => b.id === id);
        if (idx !== -1) books[idx] = updated;
        saveLocalBooks(books);
      }
      await loadBooks();
      showPage('home');
    });

    async function deleteBook(book) {
      if (!confirm(`Delete "${book.title}"?`)) return;
      try {
        const res = await fetch(`${ENDPOINTS.books}/${book.id}`, {
          method: 'DELETE',
          headers: authHeaders()
        });
        if (!res.ok) throw new Error();
      } catch {
        const books = localBooks().filter(b => b.id !== book.id);
        saveLocalBooks(books);
      }
      await loadBooks();
    }

    // ---- Quotes: unified storage, full CRUD (add/edit/delete) -----------
    const SEED_QUOTES = [
      { id: 'seed-1', text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
      { id: 'seed-2', text: "Whether you think you can or think you can't, you're right.", author: "Henry Ford" },
      { id: 'seed-3', text: "Keep going.", author: "Winston Churchill" },
      { id: 'seed-4', text: "If you're offered a seat on a rocket ship, don't ask what seat! Just get on.", author: "Sheryl Sandberg" },
      { id: 'seed-5', text: "When I let go of what I am, I become what I might be.", author: "Lao Tzu" }
    ];

    function loadQuotesFromStorage() {
      const stored = localStorage.getItem('quotes');
      if (stored) return JSON.parse(stored);
      saveQuotes(SEED_QUOTES); // FIX: seed quotes now live in the same
                                // persisted store the add/edit/delete code uses,
                                // instead of being separate static HTML.
      return SEED_QUOTES;
    }
    function saveQuotes(quotes) { localStorage.setItem('quotes', JSON.stringify(quotes)); }

    function renderQuotes() {
      const quotes = loadQuotesFromStorage();
      const list = document.getElementById('quotesList');
      list.innerHTML = '';
      quotes.forEach(q => {
        const li = document.createElement('li');
        li.className = 'list-group-item quote-item mb-2';
        li.innerHTML = `
          <blockquote class="blockquote text-center">
            <p class="mb-1 fst-italic">${escapeHtml(q.text)}</p>
            <footer class="blockquote-footer fw-bold">${escapeHtml(q.author)}</footer>
          </blockquote>
          <div class="text-center mt-2">
            <button class="btn btn-sm btn-outline-primary me-1 quote-edit">Edit</button>
            <button class="btn btn-sm btn-outline-danger quote-delete">Delete</button>
          </div>`;
        li.querySelector('.quote-edit').addEventListener('click', () => startEditQuote(q));
        li.querySelector('.quote-delete').addEventListener('click', () => deleteQuote(q.id)); // FIX: delete now implemented
        list.appendChild(li);
      });
    }

    function startEditQuote(q) { // FIX: edit now implemented
      document.getElementById('quoteEditId').value = q.id;
      document.getElementById('quoteText').value = q.text;
      document.getElementById('quoteAuthor').value = q.author;
      document.getElementById('quoteSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Changes';
      document.getElementById('quoteCancelBtn').classList.remove('d-none');
    }

    function resetQuoteForm() {
      document.getElementById('quoteForm').reset();
      document.getElementById('quoteEditId').value = '';
      document.getElementById('quoteSubmitBtn').innerHTML = '<i class="fas fa-plus"></i> Add Quote';
      document.getElementById('quoteCancelBtn').classList.add('d-none');
    }
    document.getElementById('quoteCancelBtn').addEventListener('click', resetQuoteForm);

    document.getElementById('quoteForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('quoteText').value.trim();
      const author = document.getElementById('quoteAuthor').value.trim();
      const editId = document.getElementById('quoteEditId').value;
      if (!text || !author) return;

      const quotes = loadQuotesFromStorage();
      if (editId) {
        const idx = quotes.findIndex(q => q.id === editId);
        if (idx !== -1) quotes[idx] = { id: editId, text, author };
      } else {
        quotes.push({ id: crypto.randomUUID(), text, author });
      }
      saveQuotes(quotes);
      renderQuotes();
      resetQuoteForm();
    });

    function deleteQuote(id) {
      const quotes = loadQuotesFromStorage().filter(q => q.id !== id);
      saveQuotes(quotes);
      renderQuotes();
    }

    // ---- Init -------------------------------------------------------------
    setLoggedInUI();
    loadBooks();
    renderQuotes();
    showPage('home');
  </script>
</body>

</html>
